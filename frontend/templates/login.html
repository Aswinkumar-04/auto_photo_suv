<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Portal Login | SUV Photography</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #f8f5f0;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(74, 21, 33, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(200, 164, 90, 0.08) 0%, transparent 50%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 44px 34px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-md);
            text-align: center;
            position: relative;
        }
        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            height: 3px;
            background: var(--gold-gradient);
            border-radius: 999px;
        }
        .login-brand-logo {
            height: 60px;
            max-width: 260px;
            width: auto;
            object-fit: contain;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <img src="/static/logo_dark.png" alt="SUV Photography Logo" class="login-brand-logo">
            <div class="script-accent" style="margin-bottom: 2px;">Welcome to</div>
            <h1 style="font-size:1.85rem; font-weight:700; margin-bottom:6px; color:var(--color-heading);">Studio Host Portal</h1>
            <p style="color:var(--color-muted); font-size:0.9rem; margin-bottom:28px;">Enter your host password to manage event photos, Google Drive sync, and guest QR codes.</p>

            <div id="error-alert" class="alert alert-danger" style="display:none;"></div>

            <form id="login-form">
                <div class="form-group" style="text-align:left;">
                    <label class="form-label" for="password">Studio Access Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autofocus>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="margin-top:10px;">
                    <span>Sign In to Portal</span>
                </button>
            </form>

            <div style="margin-top:28px; padding-top:18px; border-top:1px solid var(--color-border);">
                <a href="/guest" style="color:var(--color-muted); font-size:13px; text-decoration:none; font-weight:500;">
                    ← View Guest Selfie Page
                </a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const passInput = document.getElementById('password');
        const errAlert = document.getElementById('error-alert');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Verifying...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passInput.value })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errAlert.textContent = data.detail || 'Invalid password. Please try again.';
                    errAlert.style.display = 'flex';
                }
            } catch (err) {
                errAlert.textContent = 'Network error. Please try again.';
                errAlert.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In to Portal</span>';
            }
        });
    </script>
</body>
</html>
